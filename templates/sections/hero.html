<section id="$id" class="hero surface-dark" aria-labelledby="$id-title">
  <div class="wrap hero-grid">
    <div class="hero-copy">
      <p class="section-label"><span class="num">$number</span></p>
      <h1 id="$id-title" class="display">$h1</h1>
      <ul class="identities">$identities</ul>
      <p class="lead hero-statement">$statement</p>
      <div class="cta-pair">$ctas</div>
    </div>
  </div>
</section>
