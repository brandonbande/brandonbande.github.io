# Build, check and (after cut-over) deploy brandonbande.co.zw.
#
# Every push and pull request: draft build + post-build checks (no deploy).
# main: release build and deploy of dist/ to GitHub Pages (Settings → Pages → Source must be
#       "GitHub Actions"). The integrity gate runs with --override: open items
#       are listed in the log but do not block. Remove --override once every item is approved.
name: site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Draft build + checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build (draft)
        run: python3 scripts/build.py
      - name: Release gate status (informational)
        continue-on-error: true
        run: python3 scripts/build.py --release --out "$RUNNER_TEMP/release-preview"

  build:
    name: Release build
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build (release)
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY || vars.WEB3FORMS_ACCESS_KEY }}
        run: python3 scripts/build.py --release --override
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
